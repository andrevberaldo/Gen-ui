name: Deploy Documentação A2UI para GitHub Pages

on:
  push:
    branches:
      - claude/mkdocs-portuguese-docs-l9rysy
      - main
  pull_request:
    branches:
      - claude/mkdocs-portuguese-docs-l9rysy
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências
      run: pip install -r requirements.txt

    - name: Build MkDocs
      run: mkdocs build

    - name: Deploy para GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/claude/mkdocs-portuguese-docs-l9rysy'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
